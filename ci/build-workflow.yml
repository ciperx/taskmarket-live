name: build and deploy

on:
  push:
    branches: [main]
  schedule:
    # hourly. GitHub's scheduler is best-effort and can drift by a few minutes
    # under load, which is why the page prints the exact fetch time it used.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No dependencies to install: the build uses only Node's built-in fetch
      # and fs. Nothing is downloaded, so there is nothing to audit or pin.

      - name: Fetch the API and render the page
        run: node build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
